# Local Postgres plus a Neon-compatible HTTP proxy, so the Neon serverless driver works offline.
# Values come from .env (written by `ss create`).
services:
  postgres:
    image: postgres:17
    command: '-d 1'
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=main
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      - PG_CONNECTION_STRING=${PG_CONNECTION_STRING:?set PG_CONNECTION_STRING in .env}
    ports:
      - '127.0.0.1:${NEON_PROXY_PORT:-4444}:4444'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data:
